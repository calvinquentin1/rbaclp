<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#FFFFFF;
  --surface:#F8F6F3;
  --surface-hi:#F1EDE6;
  --text:#141414;
  --text-2:#4A4A4A;
  --text-dim:#7C7C7C;
  --accent:#CF5000;
  --accent-ink:#9E3C00;
  --accent-dk:#A63F00;
  --border:#E4DFD7;
  --ok:#1F7A3D;
  --r:5px;
}

html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  font-size:17px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

a{color:inherit;text-decoration:none}

.wrap{width:100%;max-width:720px;margin:0 auto;padding:0 20px}

/* ── BUTTON — one CTA, same wording everywhere ── */
.btn{
  display:inline-block;
  background:var(--accent);
  color:#fff;
  font-size:18px;
  font-weight:800;
  letter-spacing:.01em;
  padding:18px 32px;
  border-radius:var(--r);
  border:none;
  cursor:pointer;
  width:100%;
  max-width:420px;
  transition:background .15s ease,transform .1s ease;
}
.btn:hover{background:var(--accent-dk)}
.btn:active{transform:scale(.99)}
.btn:focus-visible{outline:3px solid var(--accent-dk);outline-offset:3px}
.btn__sub{
  display:block;
  font-size:13px;font-weight:600;
  color:var(--text-dim);
  margin-top:10px;
  letter-spacing:.01em;
}

/* ── HERO — phone fold: headline, one line of sub, CTA. Nothing else. ── */
.hero{
  padding:44px 0 40px;
  text-align:center;
  border-bottom:1px solid var(--border);
  background:
    radial-gradient(ellipse 90% 60% at 50% 0%, rgba(207,80,0,.07) 0%, transparent 65%),
    var(--bg);
}
.hero__hl{
  font-size:clamp(34px,8vw,52px);
  font-weight:900;
  line-height:1.03;
  letter-spacing:-.03em;
  text-wrap:balance;
  margin-bottom:18px;
}
.hero__hl em{font-style:normal;color:var(--accent-ink)}
.hero__sub strong{color:var(--accent-ink);font-weight:800}
.hero__sub{
  font-size:clamp(18px,4.2vw,21px);
  color:var(--text-2);
  font-weight:600;
  line-height:1.45;
  max-width:540px;
  margin:0 auto 30px;
  text-wrap:balance;
}

/* ── ORIGIN BAND — answers "where do the leads come from?" ── */
.band{
  background:var(--text);
  color:#fff;
  padding:34px 0 32px;
  text-align:center;
}
.band__hl{
  font-size:clamp(22px,5.2vw,30px);
  font-weight:900;
  letter-spacing:-.025em;
  line-height:1.15;
  text-wrap:balance;
  margin-bottom:22px;
}
.band__hl em{font-style:normal;color:#FF7A2F}
.band__steps{
  display:flex;
  flex-direction:column;
  gap:12px;
  max-width:560px;
  margin:0 auto;
  text-align:left;
}
.band__s{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:12px;
  align-items:baseline;
  font-size:15.5px;
  line-height:1.5;
  color:rgba(255,255,255,.88);
}
.band__n{
  font-size:12px;font-weight:800;
  color:#FF7A2F;
  letter-spacing:.06em;
}
.band__s strong{color:#fff;font-weight:700}

@media(min-width:640px){
  .band__steps{
    flex-direction:row;
    text-align:center;
    gap:28px;
    max-width:760px;
  }
  .band__s{grid-template-columns:1fr;gap:6px;justify-items:center}
}

/* ── PRODUCT SHOT — the CRM, in a browser frame ── */
.shot{
  width:100%;
  max-width:560px;
  margin:0 auto 16px;
  border-radius:10px;
  overflow:hidden;
  background:#1B1B1B;
  border:1px solid rgba(0,0,0,.14);
  box-shadow:0 12px 34px rgba(20,20,20,.16), 0 2px 6px rgba(20,20,20,.08);
}
.shot__bar{
  display:flex;align-items:center;gap:6px;
  padding:8px 11px;
  background:#2A2A2A;
}
.shot__dot{width:9px;height:9px;border-radius:50%;background:#4A4A4A}
.shot__url{
  flex:1;margin-left:8px;
  background:#1B1B1B;
  border-radius:4px;
  font-size:10px;
  color:#8A8A8A;
  padding:4px 9px;
  text-align:left;
  letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.shot__media{
  position:relative;
  width:100%;
  aspect-ratio:2120/1080;
  background:#101010;
}
.shot__media video{
  position:absolute;inset:0;
  width:100%;height:100%;
  display:block;border:0;
}
.shot__cap{
  font-size:12.5px;
  color:var(--text-dim);
  text-align:center;
  margin:0 auto 18px;
  letter-spacing:.01em;
}

/* ── HERO CONVERSATION — the product, as a text thread ── */
.hconvo{
  width:100%;
  max-width:318px;
  margin:0 auto 16px;
  background:#fff;
  border-radius:22px;
  padding:24px 11px 14px;
  text-align:left;
  box-shadow:0 0 0 8px #1C1C1C, 0 0 0 9px #3A3A3A, 0 14px 34px rgba(20,20,20,.26);
  position:relative;
}
.hconvo::before{
  content:'';position:absolute;top:7px;left:50%;transform:translateX(-50%);
  width:76px;height:14px;border-radius:0 0 10px 10px;background:#1C1C1C;
}
.hc__hd{
  font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-dim);text-align:center;
  padding-bottom:8px;margin-bottom:10px;
  border-bottom:1px solid var(--border);
}
.hc__ctx{
  font-size:11px;color:#8A8A8A;
  text-align:center;line-height:1.4;
  margin:0 6px 10px;
}
.hc__row{display:flex;margin-bottom:7px}
.hc__row--out{justify-content:flex-end}
.hc__b{
  max-width:86%;
  padding:8px 12px;
  border-radius:18px;
  font-size:14px;
  line-height:1.35;
  -webkit-font-smoothing:antialiased;
}
.hc__row--in .hc__b{background:#E9E9EB;color:#000;border-bottom-left-radius:5px}
.hc__row--out .hc__b{background:#007AFF;color:#fff;border-bottom-right-radius:5px}
.hc__tag{
  display:inline-block;
  font-size:9px;font-weight:800;letter-spacing:.11em;
  background:rgba(255,255,255,.25);
  color:#fff;
  padding:1.5px 5px;border-radius:3px;
  margin-bottom:4px;
}

.hc__note{
  font-size:12px;
  color:var(--text-dim);
  text-align:center;
  line-height:1.45;
  margin:0 auto 13px;
  max-width:330px;
}
.hc__note strong{color:var(--text-2);font-weight:700}

/* ── SECTIONS ── */
.sec{padding:52px 0;border-bottom:1px solid var(--border)}
.sec--tint{background:var(--surface)}

.eyebrow{
  font-size:12px;font-weight:800;letter-spacing:.15em;
  text-transform:uppercase;color:var(--accent-ink);
  margin-bottom:14px;
}
.h2{
  font-size:clamp(26px,5.6vw,36px);
  font-weight:900;
  letter-spacing:-.025em;
  line-height:1.12;
  text-wrap:balance;
  margin-bottom:18px;
}
.lede{font-size:17px;color:var(--text-2);line-height:1.62;margin-bottom:16px}
.lede:last-child{margin-bottom:0}
.lede strong{color:var(--text);font-weight:700}

/* ── PHONE / CONVERSATION ── */
.convo-grid{display:flex;flex-direction:column;gap:52px;margin-top:34px;padding:0 6px}

.phone{
  position:relative;
  background:#fff;
  border-radius:30px;
  padding:26px 14px 22px;
  max-width:340px;
  margin:0 auto;
  /* real handset: dark bezel, inner screen edge, drop shadow */
  box-shadow:
    0 0 0 9px #1C1C1C,
    0 0 0 10px #333,
    0 16px 38px rgba(20,20,20,.28);
}
/* notch */
.phone::before{
  content:'';
  position:absolute;top:9px;left:50%;transform:translateX(-50%);
  width:86px;height:16px;border-radius:0 0 11px 11px;
  background:#1C1C1C;
}
.phone__hd{
  font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-dim);
  padding-bottom:12px;margin-bottom:14px;
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;gap:10px;align-items:baseline;
}
.phone__hd--bad{color:#A31515}
.phone__hd--good{color:var(--ok)}

.msg{display:flex;margin-bottom:10px}
.msg__b{
  max-width:82%;
  padding:11px 14px;
  border-radius:16px;
  font-size:15.5px;
  line-height:1.45;
}
.msg--in{justify-content:flex-start}
.msg--in .msg__b{background:var(--surface-hi);color:var(--text);border-bottom-left-radius:5px}
.msg--out{justify-content:flex-end}
.msg--out .msg__b{background:var(--accent);color:#fff;border-bottom-right-radius:5px}

.stamp{
  font-size:12px;color:var(--text-dim);
  margin:2px 0 14px;
}
.msg--out + .stamp{text-align:right}

.verdict{
  margin-top:14px;padding-top:14px;
  border-top:1px solid var(--border);
  font-size:14px;font-weight:700;
}
.verdict--bad{color:#A31515}
.verdict--good{color:var(--ok)}

/* ── LIST ── */
.items{display:flex;flex-direction:column;gap:22px;margin-top:26px}
.item__t{font-size:18px;font-weight:800;letter-spacing:-.015em;margin-bottom:5px}
.item__d{font-size:16px;color:var(--text-2);line-height:1.55}
.item__d strong{color:var(--text);font-weight:700}

/* ── QUESTIONS ── */
.qs{display:flex;flex-direction:column;gap:14px;margin-top:26px}
.q{
  background:var(--bg);
  border:1px solid var(--border);
  border-left:3px solid var(--accent);
  border-radius:var(--r);
  padding:16px 18px;
  font-size:16.5px;
  font-weight:600;
  line-height:1.5;
}

/* ── STATS ── */
.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:26px 20px;
  margin:28px 0 20px;
}
.stat__n{
  font-size:clamp(32px,8vw,44px);
  font-weight:900;letter-spacing:-.03em;line-height:1;
  color:var(--accent-ink);margin-bottom:6px;
}
.stat__l{font-size:14px;color:var(--text-2);line-height:1.4;font-weight:600}
.src{font-size:13px;color:var(--text-dim);line-height:1.5;margin-top:6px}

.facts{display:flex;flex-direction:column;gap:18px;margin-top:26px}
.fact__n{font-size:20px;font-weight:900;color:var(--accent-ink);letter-spacing:-.02em}
.fact__t{font-size:16px;color:var(--text-2);line-height:1.5;margin-top:2px}
.fact__s{font-size:12.5px;color:var(--text-dim);margin-top:4px}

/* ── TIMELINE ── */
.tl{display:flex;flex-direction:column;gap:0;margin-top:26px}
.tl__row{
  display:grid;grid-template-columns:auto 1fr;gap:16px;
  padding-bottom:22px;position:relative;
}
.tl__row:not(:last-child)::before{
  content:'';position:absolute;left:13px;top:30px;bottom:0;
  width:2px;background:var(--border);
}
.tl__dot{
  width:28px;height:28px;border-radius:50%;
  background:var(--surface-hi);border:2px solid var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:var(--accent-ink);
  position:relative;z-index:1;flex-shrink:0;
}
.tl__t{font-size:16.5px;font-weight:800;margin-bottom:3px;letter-spacing:-.01em}
.tl__d{font-size:15px;color:var(--text-2);line-height:1.5}

/* ── PRICE ── */
.price{
  background:var(--bg);
  border:2px solid var(--accent);
  border-radius:8px;
  padding:30px 24px;
  text-align:center;
  margin-top:26px;
}
.price__n{
  font-size:clamp(34px,8vw,46px);
  font-weight:900;letter-spacing:-.03em;line-height:1.05;
  margin-bottom:8px;
}
.price__d{font-size:16px;color:var(--text-2);font-weight:600}

.compare{
  display:grid;grid-template-columns:1fr;
  gap:14px;margin-top:26px;
}
.cmp{
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:18px 20px;
  background:var(--bg);
}
.cmp__l{font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px}
.cmp__n{font-size:26px;font-weight:900;letter-spacing:-.025em;margin-bottom:4px}
.cmp__d{font-size:14.5px;color:var(--text-2);line-height:1.5}
.cmp--them .cmp__n{color:var(--text)}
.cmp--us{border-color:var(--accent);border-width:2px}
.cmp--us .cmp__n{color:var(--accent-ink)}

/* ── CLOSE ── */
.close{padding:56px 0 60px;text-align:center}
.close__hl{
  font-size:clamp(28px,6vw,38px);
  font-weight:900;letter-spacing:-.025em;line-height:1.12;
  text-wrap:balance;margin-bottom:16px;
}
.close__d{
  font-size:17px;color:var(--text-2);line-height:1.6;
  max-width:520px;margin:0 auto 28px;
}

.footer{
  padding:26px 0 40px;
  text-align:center;
  font-size:13px;
  color:var(--text-dim);
  line-height:1.6;
  border-top:1px solid var(--border);
}

/* ── MODAL ── */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:999;
  background:rgba(0,0,0,.75);
  align-items:center;justify-content:center;padding:16px;
}
.modal-overlay.open{display:flex}
.modal__box{
  position:relative;background:var(--surface);
  border:1px solid var(--border);border-radius:8px;
  width:min(780px,100%);height:min(680px,92vh);
  overflow:hidden;display:flex;flex-direction:column;
}
.modal__close{
  position:absolute;top:12px;right:14px;z-index:10;
  background:var(--surface-hi);border:1px solid var(--border);
  color:var(--text-2);border-radius:var(--r);
  width:36px;height:36px;font-size:20px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.modal__close:hover{background:var(--border);color:var(--text)}
.modal__iframe{flex:1;border:none;width:100%;height:100%;background:var(--bg)}

@media(min-width:640px){
  .convo-grid{flex-direction:row;gap:42px}
  .convo-grid > *{flex:1}
  .compare{grid-template-columns:1fr 1fr;align-items:start}
}

/* Phone: size the hero to its content. Forcing 100dvh reserved height
   iOS hides behind its toolbars, which left dead space under the CTA and
   pushed the band that answers "where do the leads come from" off screen. */
@media(max-width:639px){
  .hero{padding:12px 0 20px}
  .hero__hl{margin-bottom:12px}
  .hero__sub{margin-bottom:10px;font-size:16px}
  /* the real transcript runs longer than the sample it replaced, so the
     handset tightens on phones to keep the CTA above the fold */
  .hconvo{padding:20px 11px 10px}
  .hc__ctx{margin-bottom:8px}
  .hc__row{margin-bottom:5px}
  .hc__b{font-size:13px;padding:7px 11px;line-height:1.34}
  .hc__note{margin-bottom:7px;font-size:11.5px}
  .shot{margin-bottom:12px}
  .shot__cap{font-size:12px;margin-bottom:14px}
  .band{padding:28px 0 26px}
  .band__hl{margin-bottom:18px}
}

/* very short handsets: the caption is the first thing to go */
@media(max-width:639px) and (max-height:640px){
  /* the opening question is restated in the line above it, so it goes
     first - the reply and the hand-off to the team are the payoff */
  .hconvo .hc__row:nth-of-type(1){display:none}
}

@media(max-width:639px) and (max-height:545px){
}

@media(max-width:639px) and (max-height:600px){
  .shot__cap{display:none}
  .hero{padding-top:14px}
  /* the thread reads on its own; the proof caption under it stays */
  .hc__ctx{display:none}
}

/* very short screens: shrink the shot so the CTA always clears */
@media(max-width:639px) and (max-height:545px){
  .hconvo{max-width:272px}
  .hc__note{display:none}
  .shot{max-width:268px}
  .hero__hl{font-size:29px}
  .hero__sub{font-size:15.5px;margin-bottom:14px}
  .hero{padding-top:12px}
}

@media(max-width:400px){
  body{font-size:16px}
  /* the 34px floor wraps the headline to four lines below 390px wide,
     which pushes the CTA under the fold on SE-sized phones */
  .hero__hl{font-size:8.6vw}
  .sec{padding:44px 0}
}

@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
/* ── 60-day lead guarantee ── */
.guar__wrap{display:flex;gap:30px;align-items:center;max-width:860px}
.guar__seal{flex:0 0 auto;width:136px;height:136px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 0 6px rgba(207,80,0,.16)}
.guar__seal span{font-size:13px;font-weight:700;letter-spacing:.10em;line-height:1.35;text-transform:uppercase}
.guar__seal b{display:block;font-size:19px;letter-spacing:.04em}
.guar__body{min-width:0}
.guar__body .h2{margin-top:0}
@media(max-width:640px){.guar__wrap{flex-direction:column;text-align:center;gap:20px}}
.hero__eyebrow{display:inline-block;background:#16181d;color:#fff;font-size:14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:9px 16px;border-radius:8px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.hero__eyebrow .st{color:#f5a623}
@media (max-width:719px){.hero__eyebrow{margin-bottom:10px;font-size:12px;padding:8px 12px;letter-spacing:.02em}}
.topbar{background:#111;color:#fff;text-align:center;padding:12px 16px 10px}.topbar__t{font-weight:900;font-size:26px;letter-spacing:.02em}.topbar__s{font-style:italic;font-weight:600;font-size:14px;margin-top:4px;opacity:.9}
.hero--cal{padding-top:16px}
.hero__qual{font-style:italic;color:var(--text-dim);font-size:16px;margin:12px 0 6px}.hero__guar{font-weight:800;color:#9a3c00;font-size:16px;margin:0}
.cal__rule{height:3px;background:#111;margin:12px 0 10px}.cal__arrow{font-weight:900;font-size:26px;margin:0}.cal__lead{font-size:15px;margin:4px 0 12px;color:var(--text-dim)}

<!-- ══ 1. HERO (calendar-first) ══ -->
<div class="topbar"><div class="topbar__t">HVAC COMPANIES</div><div class="topbar__s">Stop paying for shared leads.</div></div>
<section class="hero hero--cal">
  <div class="wrap">
    <h1 class="hero__hl">We build the system. <em>You get exclusive HVAC leads every week.</em></h1>
    <p class="hero__qual">Built for HVAC owners with a sales team.</p>
    <div class="cal__rule"></div>

<!-- CALENDAR MODAL -->
<div class="modal-overlay" id="calModal" role="dialog" aria-modal="true" aria-label="Book a 20-minute call">
  <div class="modal__box">
    <button class="modal__close" onclick="closeCal()" aria-label="Close">&times;</button>
    <iframe class="modal__iframe" id="calFrame" src="" title="Book a 20-minute call" loading="lazy" scrolling="yes"></iframe>
  </div>
</div>

<script>
  /* Booking calendar. Same one the current roofing page uses. */
  var CAL_URL = "https://api.leadconnectorhq.com/widget/booking/xif35Cij0FrgjTPONoFL";

  /* Carry UTM parameters through to the booking widget so GoHighLevel
     can attribute the booking back to the ad and to this page. */
  function calUrlWithUtms() {
    var incoming = new URLSearchParams(window.location.search);
    var keep = new URLSearchParams();
    incoming.forEach(function (v, k) {
      if (/^utm_/i.test(k) || k === "fbclid" || k === "gclid") keep.append(k, v);
    });
    var qs = keep.toString();
    return qs ? CAL_URL + "?" + qs : CAL_URL;
  }

  function openCal() {
    var frame = document.getElementById("calFrame");
    if (!frame.src || frame.src === window.location.href) frame.src = calUrlWithUtms();
    document.getElementById("calModal").classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeCal() {
    document.getElementById("calModal").classList.remove("open");
    document.body.style.overflow = "";
  }

  document.getElementById("calModal").addEventListener("click", function (e) {
    if (e.target === this) closeCal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeCal();
  });
</script>
