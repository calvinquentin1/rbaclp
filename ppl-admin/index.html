<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cosa Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Cosa Hub: agency dashboard for pay-per-lead and retainer clients (Calvin, 20 Nov 2026, layout "Option A").
   Data: Supabase "Cosa Marketing PPL" via the ppl-admin function (password). Times shown in ET. */
:root{--bg:#F5F7FA;--card:#fff;--ink:#0F1B2A;--muted:#6B7685;--faint:#9AA4B2;--line:#E4E8EE;--line2:#EEF1F5;--side:#0E2238;--side2:#1A3555;--navy:#13345A;--blue:#2563EB;--amber:#F5B83D;--ok:#16A34A;--okbg:#E8F6EE;--warn:#B45309;--warnbg:#FEF4E2;--bad:#DC2626;--badbg:#FDECEC;--soft:#F0F4F9;--sel:#F4F8FF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 Inter,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
a{color:var(--blue);text-decoration:none}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);color:#C8D3E0;padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;align-self:start}
.shell{background:linear-gradient(to right,var(--side) 220px,transparent 220px)}
.logo{display:flex;align-items:center;gap:9px;color:#fff;font:800 16px Inter;padding:4px 10px 18px}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--amber);color:var(--side);display:grid;place-items:center;font:900 15px Inter;font-style:normal}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-weight:600;color:#C8D3E0;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:rgba(255,255,255,.05)}
.nav svg{width:17px;height:17px;opacity:.85;flex:none}
.nav.on{background:var(--side2);color:#fff}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font:700 11px Inter;padding:1px 7px}
.side-foot{margin-top:auto;font-size:12px;color:#7F92A8;padding:10px;display:flex;flex-direction:column;gap:8px}
.side-foot button{background:none;border:1px solid #2B4566;color:#C8D3E0;border-radius:8px;padding:6px 10px;font-weight:600}
main{padding:22px 28px 60px;min-width:0}
.top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.crumb{color:var(--muted);font-size:12.5px;margin-bottom:4px}.crumb a{color:var(--muted)}
h1{font:800 22px Inter;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font:700 11.5px Inter;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.mut{background:#EEF1F5;color:#4B5563}.pill.info{background:#EAF0FB;color:#1D4ED8}
.pill.ppl{background:#EAF0FB;color:#1D4ED8}.pill.retainer{background:#F1EAFB;color:#6D28D9}.pill.test{background:#F3F0FF;color:#6D28D9}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;flex:none}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-weight:600;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#CBD3DE}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:wait}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpis.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.k small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.k b{display:block;font:800 26px Inter;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k b span{font-size:14px;color:var(--faint);font-weight:600}
.k .d{font-size:12px;color:var(--muted);margin-top:2px}.k .d.up{color:var(--ok)}.k .d.dn{color:var(--bad)}
.k b.na{font-size:15px;color:var(--faint);font-weight:600;margin-top:10px}
.bar{height:6px;border-radius:99px;background:var(--line2);margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.bar.warn i{background:var(--amber)}.bar.ok i{background:var(--ok)}.bar.bad i{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.card-h h2{font:700 15px Inter;margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto}
.tab{padding:11px 12px;font-weight:600;color:var(--muted);border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--navy)}.tab em{font-style:normal;color:var(--faint);font-weight:600;margin-left:4px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font:600 11.5px Inter;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 16px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#FAFBFD}tr.sel td{background:var(--sel)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}
.chev{color:var(--faint);width:20px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.split.closed{grid-template-columns:minmax(0,1fr)}
.drawer{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(15,27,42,.10);position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.drawer .hd{padding:16px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.drawer .hd b{font:800 17px Inter}
.x{border:0;background:none;color:var(--faint);font-size:18px;line-height:1;padding:2px 6px}
.sec{padding:14px 16px;border-bottom:1px solid var(--line2)}
.sec:last-child{border-bottom:0}
.lbl{font:600 11px Inter;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.kv{display:grid;grid-template-columns:100px minmax(0,1fr);gap:6px 10px;font-size:13px}.kv>span:nth-child(odd){color:var(--muted)}
.kv .v{word-break:break-word}
.quote{background:var(--soft);border-radius:8px;padding:10px;font-size:12px;color:#475569;line-height:1.5}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:start;padding:6px 0;font-size:12.5px}
.tl li i{width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--faint)}
.tl li i.ok{background:var(--ok)}.tl li i.failed{background:var(--bad)}.tl li i.off,.tl li i.skipped{background:#CBD3DE}
.tl time{color:var(--faint);white-space:nowrap}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line2)}
.alert:last-child{border-bottom:0}
.alert.click{cursor:pointer}.alert.click:hover{background:#FAFBFD}
.alert .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;font:800 14px Inter}
.alert.bad .ic{background:var(--badbg);color:var(--bad)}.alert.warn .ic{background:var(--warnbg);color:var(--warn)}.alert.info .ic{background:#EAF0FB;color:#1D4ED8}
.alert b{display:block}.alert p{margin:1px 0 0;color:var(--muted);font-size:12.5px;white-space:normal}
.health{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.health.ok{color:var(--ok)}.health.warn{color:var(--warn)}.health.bad{color:var(--bad)}.health.mut{color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line2)}
input,select,textarea{font:14px Inter;padding:8px 10px;border:1px solid #CBD3DE;border-radius:8px;background:#fff;color:var(--ink);width:100%}
.filters input,.filters select{width:auto;min-width:160px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.form{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 16px}
.form h3{grid-column:1/-1;margin:8px 0 0;font:700 13px Inter;color:var(--navy);border-top:1px solid var(--line2);padding-top:14px}
.form h3:first-child{border:0;padding-top:0;margin-top:0}
.form .full{grid-column:1/-1}
.err{color:var(--bad);font-weight:600}.okmsg{color:var(--ok);font-weight:600}
.login{max-width:360px;margin:12vh auto;padding:24px}
.login .logo{color:var(--ink);padding:0 0 16px}
.mini td,.mini th{padding:8px 16px}
.inline{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line2)}
.inline>div{min-width:110px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:9}
@media(max-width:1100px){.kpis.five{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2,.split{grid-template-columns:minmax(0,1fr)}.drawer{position:static;max-height:none}}
@media(max-width:860px){.shell{grid-template-columns:1fr;background:none}aside{position:sticky;height:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:4px;z-index:5}.logo{padding:4px 8px}.logo span{display:none}.side-foot{display:none}.nav{width:auto;white-space:nowrap}main{padding:16px}.kpis,.kpis.five{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
const API = "https://gwekfiwckclqszxidqqz.supabase.co/functions/v1/ppl-admin";
const PAGE = "https://home.cosaventures.com/";
const root = document.getElementById("root");
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const pretty = s => String(s ?? "").replace(/\b(\d{4})-(\d{2})-(\d{2})\b/g, (_,y,m,d) => new Date(`${y}-${m}-${d}T12:00:00Z`).toLocaleDateString("en-US",{month:"short",day:"numeric"}));
const TZ = "America/New_York";
const dayKey = d => new Date(d).toLocaleDateString("en-CA",{timeZone:TZ});
const when = d => { if (!d) return ""; const t = new Date(d), today = dayKey(Date.now()), y = dayKey(Date.now()-864e5), k = dayKey(t);
  const hm = t.toLocaleTimeString("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"});
  return k===today ? "Today "+hm : k===y ? "Yesterday "+hm : t.toLocaleDateString("en-US",{timeZone:TZ,month:"short",day:"numeric"})+", "+hm; };
const full = d => d ? new Date(d).toLocaleString("en-US",{timeZone:TZ,month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit",second:"2-digit"})+" ET" : "";
const dateOnly = d => d ? new Date(d.length===10 ? d+"T12:00:00Z" : d).toLocaleDateString("en-US",{timeZone:TZ,month:"short",day:"numeric",year:"numeric"}) : "";
const ago = d => { if (!d) return "never"; const m = (Date.now()-new Date(d))/6e4; return m<1?"just now":m<60?Math.round(m)+"m ago":m<1440?Math.round(m/60)+"h ago":Math.round(m/1440)+"d ago"; };
const money = c => c==null ? "" : "$"+(c/100).toLocaleString("en-US",{maximumFractionDigits:c%100?2:0});
const phone = p => { const d = String(p||"").replace(/\D/g,"").slice(-10); return d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:esc(p); };
const name = l => esc(((l.first_name||"")+" "+(l.last_name?l.last_name[0]+".":"")).trim());
const fullName = l => esc(((l.first_name||"")+" "+(l.last_name||"")).trim());
const STATUS = {new:["mut","New"],qualified:["ok","Qualified"],returned:["bad","Returned"],rejected:["bad","Rejected"],duplicate:["mut","Duplicate"]};
const st = s => { const [c,t] = STATUS[s]||["mut",s]; return `<span class="pill ${c}">${t}</span>`; };
const type = t => `<span class="pill ${t==="retainer"?"retainer":"ppl"}">${t==="retainer"?"Retainer":"PPL"}</span>`;
const health = h => `<span class="health ${h.level}"><span class="dot"></span>${esc(h.label)}</span>`;
const adOf = l => { const u = l.utm||{}; return u.utm_content || u.utm_campaign || (l.fbclid?"Ad click":"Direct"); };
const ICON = {
  overview:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  alerts:'<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  clients:'<path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-7h6v7"/>',
  leads:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M17 11h5M19.5 8.5v5"/>',
  billing:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>'};
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

let pw = ""; try { pw = sessionStorage.getItem("hub_pw") || sessionStorage.getItem("ppl_pw") || ""; } catch(_e) {}
let cache = {list:null};
let alertCount = 0;

async function call(action, extra={}) {
  const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({password: pw, action, ...extra})});
  const j = await r.json().catch(() => ({error:"Server error"}));
  if (r.status === 403 || r.status === 429) { pw = ""; try { sessionStorage.removeItem("hub_pw"); } catch(_e) {} login(j.error); throw new Error("__login"); }
  if (!r.ok) throw new Error(j.error || "Error");
  return j;
}
function toast(t){ const d = document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }

function login(msg) {
  root.innerHTML = `<div class="card login"><div class="logo"><i>C</i>Cosa Hub</div><form id="lf"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" autofocus>
  <p class="err" id="le">${esc(msg||"")}</p><button class="btn pri" type="submit" style="width:100%">Sign in</button></form></div>`;
  document.getElementById("lf").onsubmit = e => { e.preventDefault(); pw = document.getElementById("pw").value; try { sessionStorage.setItem("hub_pw", pw); } catch(_e) {} route(); };
}

function shell(active, body) {
  const navs = [["overview","Overview"],["alerts","Alerts"],["clients","Clients"],["leads","Leads"],["billing","Billing"]];
  root.innerHTML = `<div class="shell"><aside><div class="logo"><i>C</i><span>Cosa Hub</span></div>
  ${navs.map(([k,t]) => `<button class="nav ${k===active?"on":""}" data-go="#/${k}">${svg(k)}${t}${k==="alerts"&&alertCount?`<span class="badge">${alertCount}</span>`:""}</button>`).join("")}
  <div class="side-foot"><span>Times in ET</span><button id="out">Sign out</button></div></aside><main id="main">${body}</main></div>`;
  root.querySelectorAll("[data-go]").forEach(b => b.onclick = () => location.hash = b.dataset.go);
  document.getElementById("out").onclick = () => { try { sessionStorage.removeItem("hub_pw"); } catch(_e) {} pw=""; login(); };
  return document.getElementById("main");
}
const loading = active => shell(active, `<p class="muted">Loading…</p>`);

async function getList(force) { if (!cache.list || force) { cache.list = await call("list"); } const live = cache.list.clients.filter(c => !c.is_test);
  alertCount = cache.list.clients.reduce((s,c) => s + c.alerts.filter(a => a.level!=="info").length, 0); return cache.list; }

// ---------- Overview
async function overview() {
  loading("overview"); const d = await getList(true);
  const live = d.clients.filter(c => !c.is_test), act = live.filter(c => c.status==="active");
  const sum = (a,k) => a.reduce((s,c) => s + (c[k]||0), 0);
  const l7 = sum(live,"leads_7d"), lp = sum(live,"leads_prev_7d"), sp7 = sum(live,"spend_7d_cents"), hasAds = live.some(c => c.has_ad_stats);
  const mrr = act.filter(c => c.client_type==="retainer").reduce((s,c) => s + (c.monthly_price_cents||0), 0);
  const pct = lp ? Math.round((l7-lp)/lp*100) : null;
  const alerts = d.clients.flatMap(c => c.alerts.map(a => ({...a, c})));
  const m = shell("overview", `
  <div class="top"><div><h1>Overview</h1><div class="sub">${new Date().toLocaleDateString("en-US",{timeZone:TZ,weekday:"long",month:"short",day:"numeric"})} · all clients</div></div><button class="btn pri" data-go="#/new">+ Add client</button></div>
  <div class="kpis five">
   <div class="k"><small>Active clients</small><b>${act.length}</b><div class="d">${act.filter(c=>c.client_type==="ppl").length} pay-per-lead · ${act.filter(c=>c.client_type==="retainer").length} retainer</div></div>
   <div class="k"><small>Leads, last 7 days</small><b>${l7}</b><div class="d ${pct>0?"up":pct<0?"dn":""}">${pct==null?"no prior week yet":(pct>=0?"▲ ":"▼ ")+Math.abs(pct)+"% vs prior week"}</div></div>
   <div class="k"><small>Ad spend, 7 days</small>${hasAds?`<b>${money(sp7)}</b><div class="d">all client campaigns</div>`:`<b class="na">Meta not connected</b><div class="d">needs the Meta read token</div>`}</div>
   <div class="k"><small>Cost per lead, 7 days</small>${hasAds&&l7?`<b>${money(Math.round(sp7/l7))}</b><div class="d">spend ÷ leads</div>`:`<b class="na">n/a</b><div class="d">needs ad spend</div>`}</div>
   <div class="k"><small>Revenue this month</small><b>${money(d.ppl_month_cents + mrr)}</b><div class="d">${money(d.ppl_month_cents)} packs · ${money(mrr)} retainer</div></div></div>
  <div class="grid2">
   <div class="card"><div class="card-h"><h2>Clients</h2><span class="muted">${act.length} active</span></div>${clientTable(d.clients.filter(c => c.status!=="ended"))}</div>
   <div class="card"><div class="card-h"><h2>Needs attention</h2>${alerts.length?`<span class="pill bad">${alerts.filter(a=>a.level!=="info").length}</span>`:""}</div>${alertList(alerts.slice(0,8))}</div>
  </div>`);
  wire(m);
}
function clientTable(cs) {
  if (!cs.length) return `<div class="empty">No clients yet. Add your first client.</div>`;
  return `<div class="scroll"><table><thead><tr><th>Client</th><th>Type</th><th>Health</th><th class="n">Leads 7d</th><th class="n">CPL</th><th>Progress</th><th>Last lead</th></tr></thead><tbody>
  ${cs.map(c => `<tr class="click" data-go="#/client/${c.id}"><td><b>${esc(c.company)}</b> ${c.is_test?'<span class="pill test">Test</span>':""}<div class="faint">${esc([c.city,c.state].filter(Boolean).join(", "))}</div></td>
   <td>${type(c.client_type)}</td><td>${health(c.health)}</td><td class="n">${c.leads_7d}</td><td class="n">${c.cpl_7d_cents?money(c.cpl_7d_cents):'<span class="faint">n/a</span>'}</td>
   <td>${progress(c)}</td><td>${ago(c.last_lead_at)}</td></tr>`).join("")}</tbody></table></div>`;
}
const progress = c => c.client_type==="ppl" ? `${c.credits_left}/${c.credits_bought} credits`
  : c.guarantee ? `${c.guarantee.got}/${c.guarantee.target} · ${c.guarantee.done?"met":c.guarantee.days_left+"d left"}` : `<span class="faint">no target</span>`;
function alertList(as) {
  if (!as.length) return `<div class="empty">Nothing needs attention. 👍</div>`;
  return as.map(a => `<div class="alert ${a.level} click" data-go="#/client/${a.c.id}"><div class="ic">${a.level==="info"?"i":"!"}</div><div><b>${esc(a.c.company)}: ${esc(a.title)}</b><p>${esc(pretty(a.detail))}</p></div></div>`).join("");
}
function wire(scope) { scope.querySelectorAll("[data-go]").forEach(b => b.onclick = e => { e.stopPropagation(); location.hash = b.dataset.go; }); }

// ---------- Alerts
async function alertsView() {
  loading("alerts"); const d = await getList(true);
  const as = d.clients.flatMap(c => c.alerts.map(a => ({...a, c})));

   ${rows.length?`<div class="scroll"><table><thead><tr><th>Received</th><th>Client</th><th>Homeowner</th><th>Need</th><th>Ad</th><th>Status</th><th></th></tr></thead><tbody>
   ${rows.map(l => `<tr class="click ${l.id===lState.leadId?"sel":""}" data-lead="${l.id}"><td>${when(l.created_at)}</td><td>${esc(names[l.client_id]||"")}</td><td><b>${name(l)}</b></td><td class="muted">${esc(l.answers?.need||"")}</td><td class="muted">${esc(adOf(l))}</td><td>${st(l.status)}</td><td class="chev">›</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No leads match.</div>`}</div>
  ${lead?drawer(lead, []).replace('<div class="sec"><div class="lbl">Request</div>', `<div class="sec"><a href="#/client/${lead.client_id}">Open ${esc(names[lead.client_id]||"client")} →</a></div><div class="sec"><div class="lbl">Request</div>`):""}</div>`);
  wire(m);
  const qi = m.querySelector("#lq"); qi.oninput = () => { lState.q = qi.value; const pos = qi.selectionStart; leadsView().then(() => { const n = document.getElementById("lq"); n.focus(); n.setSelectionRange(pos,pos); }); };
  m.querySelector("#lc").onchange = e => { lState.client = e.target.value; leadsView(); };
  m.querySelector("#ls").onchange = e => { lState.status = e.target.value; leadsView(); };
  m.querySelectorAll("[data-lead]").forEach(r => r.onclick = () => { lState.leadId = r.dataset.lead; leadsView(); });
  const x = m.querySelector(".drawer .x"); if (x) x.onclick = () => { lState.leadId = null; leadsView(); };
  bindLeadActions(m, () => { lState.data = null; leadsView(); });
}

// ---------- Billing
async function billingView() {
  loading("billing"); const d = await call("billing");
  const names = Object.fromEntries(d.clients.map(c => [c.id, c])), live = p => !names[p.client_id]?.is_test;
  const ms = new Date().toLocaleDateString("en-CA",{timeZone:TZ}).slice(0,7);
  const thisMonth = d.payments.filter(p => live(p) && dayKey(p.created_at).slice(0,7)===ms);
  const packs = thisMonth.reduce((s,p) => s + (p.amount_cents||0)*(p.kind==="refund"?-1:1), 0);
  const ret = d.clients.filter(c => c.client_type==="retainer" && c.status==="active" && !c.is_test);
  const mrr = ret.reduce((s,c) => s + (c.monthly_price_cents||0), 0);
  const m = shell("billing", `<div class="top"><div><h1>Billing</h1><div class="sub">From payments recorded here. Stripe sync comes once the Stripe read key is added.</div></div></div>
  <div class="kpis"><div class="k"><small>PPL packs this month</small><b>${money(packs)}</b><div class="d">${thisMonth.filter(p=>p.kind==="purchase").length} purchases</div></div>
   <div class="k"><small>Retainer MRR</small><b>${money(mrr)}</b><div class="d">${ret.length} active retainer${ret.length===1?"":"s"}</div></div>
   <div class="k"><small>Past due</small><b>${d.clients.filter(c=>c.payment_status==="past_due"&&!c.is_test).length}</b><div class="d">retainer clients</div></div>
   <div class="k"><small>Refunds this month</small><b>${money(thisMonth.filter(p=>p.kind==="refund").reduce((s,p)=>s+(p.amount_cents||0),0))}</b><div class="d">PPL guarantee / ended</div></div></div>
  <div class="card" style="margin-bottom:18px"><div class="card-h"><h2>Retainer clients</h2></div>${ret.length?`<div class="scroll"><table><thead><tr><th>Client</th><th class="n">Monthly</th><th>Next renewal</th><th>Payment</th></tr></thead><tbody>
   ${ret.map(c => `<tr class="click" data-go="#/client/${c.id}"><td><b>${esc(c.company)}</b></td><td class="n">${money(c.monthly_price_cents)}</td><td>${dateOnly(c.next_renewal)}</td><td><span class="pill ${c.payment_status==="ok"?"ok":c.payment_status==="past_due"?"bad":"mut"}">${esc(c.payment_status)}</span></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No retainer clients yet.</div>`}</div>
  <div class="card"><div class="card-h"><h2>Payments</h2></div>${d.payments.length?`<div class="scroll"><table><thead><tr><th>When</th><th>Client</th><th>Type</th><th class="n">Credits</th><th class="n">Amount</th><th>Note</th></tr></thead><tbody>
   ${d.payments.map(p => `<tr class="click" data-go="#/client/${p.client_id}"><td>${full(p.created_at)}</td><td>${esc(names[p.client_id]?.company||"")} ${names[p.client_id]?.is_test?'<span class="pill test">Test</span>':""}</td><td>${esc(p.kind)}</td><td class="n">${p.delta>0?"+":""}${p.delta}</td><td class="n">${money(p.amount_cents)}</td><td class="muted">${esc(p.note||"")}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No payments yet.</div>`}</div>`);
  wire(m);
}

// ---------- Router
async function route() {
  if (!pw) return login();
  const [, view, id] = (location.hash || "#/overview").split("/");
  try {
    if (!cache.list) await getList();
    if (view==="client" && id) return await clientView(id);
    if (view==="new") return newClient();
    if (view==="alerts") return await alertsView();
    if (view==="clients") return await clientsView();
    if (view==="leads") { lState.data = null; return await leadsView(); }
    if (view==="billing") return await billingView();
    return await overview();
  } catch(x) { if (x.message!=="__login") shell("overview", `<p class="err">${esc(x.message)}</p>`); }
}
window.addEventListener("hashchange", route);
route();
})();
</script>
</body>
</html>
